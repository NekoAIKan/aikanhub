services:
  epay-gateway:
    build:
      context: ../..
      dockerfile: epay/deploy/Dockerfile.example
    image: kittyvibe-epay-gateway:local
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - epay_gateway_data:/var/lib/epay-gateway

volumes:
  epay_gateway_data:
