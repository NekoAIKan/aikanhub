# kittyvibe 本地开发栈
#   - app: kittyvibe 后端 + 前端（本地 build）
#   - redis: 本地缓存
#   - SQL_DSN: 本地开发 Neon PostgreSQL 分支（通过 .env.local 配置）
#
# 用法：
#   1. cp .env.local.example .env.local
#   2. docker compose -f docker-compose.local.yml --env-file .env.local up -d
#   3. 浏览器打开 http://localhost:3000
#
# 停服：docker compose -f docker-compose.local.yml down
# 重置本地 redis：docker compose -f docker-compose.local.yml down -v

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    image: kittyvibe:local
    container_name: kittyvibe-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=${SQL_DSN}
      - REDIS_CONN_STRING=${REDIS_CONN_STRING}
      - SESSION_SECRET=${SESSION_SECRET}
      - TZ=${TZ:-Asia/Shanghai}
      - PORT=${PORT:-3000}
      - ERROR_LOG_ENABLED=${ERROR_LOG_ENABLED:-true}
      - BATCH_UPDATE_ENABLED=${BATCH_UPDATE_ENABLED:-true}
      - NODE_NAME=${NODE_NAME:-kittyvibe-dev-1}
      - UPDATE_TASK=${UPDATE_TASK:-true}
      - STREAMING_TIMEOUT=${STREAMING_TIMEOUT:-300}
      # 图片审核（imageaudit 包）
      - ARK_AK=${ARK_AK:-}
      - ARK_SK=${ARK_SK:-}
      - ARK_ASSETS_PROJECT=${ARK_ASSETS_PROJECT:-default}
      - ARK_ASSETS_GROUP_NAME=${ARK_ASSETS_GROUP_NAME:-aikanhub-audit}
      - ARK_ASSETS_GROUP_ID=${ARK_ASSETS_GROUP_ID:-}
      - ARK_ASSETS_POLL_INTERVAL=${ARK_ASSETS_POLL_INTERVAL:-3}
      - ARK_ASSETS_POLL_TIMEOUT=${ARK_ASSETS_POLL_TIMEOUT:-300}
      # BytePlus 海外 ARK Assets（seedance-2.0-global / -fast-global 渠道 audit_image 用）
      - ARK_AK_GLOBAL=${ARK_AK_GLOBAL:-}
      - ARK_SK_GLOBAL=${ARK_SK_GLOBAL:-}
      - ARK_ASSETS_PROJECT_GLOBAL=${ARK_ASSETS_PROJECT_GLOBAL:-default}
      - ARK_ASSETS_GROUP_NAME_GLOBAL=${ARK_ASSETS_GROUP_NAME_GLOBAL:-aikanhub-audit}
      - ARK_ASSETS_GROUP_ID_GLOBAL=${ARK_ASSETS_GROUP_ID_GLOBAL:-}
      - ARK_HOST_GLOBAL=${ARK_HOST_GLOBAL:-ark.ap-southeast-1.byteplusapi.com}
      - ARK_REGION_GLOBAL=${ARK_REGION_GLOBAL:-ap-southeast-1}
      - COS_BUCKET=${COS_BUCKET:-}
      - COS_REGION=${COS_REGION:-ap-shanghai}
      - COS_SECRET_ID=${COS_SECRET_ID:-}
      - COS_SECRET_KEY=${COS_SECRET_KEY:-}
      - COS_OBJECT_PREFIX=${COS_OBJECT_PREFIX:-aikanhub-audit/}
      - COS_PUBLIC_HOST=${COS_PUBLIC_HOST:-}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - kittyvibe-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: kittyvibe-redis
    restart: unless-stopped
    environment:
      - REDIS_CONN_STRING=${REDIS_CONN_STRING}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    command:
      - sh
      - -c
      - |
        set -eu
        password="$${REDIS_PASSWORD:-}"
        if [ -z "$$password" ]; then
          password="$$(printf '%s' "$${REDIS_CONN_STRING:-}" | sed -n 's#^redis://:\([^@]*\)@.*#\1#p')"
        fi
        if [ -z "$$password" ]; then
          echo "REDIS_PASSWORD or a password-bearing REDIS_CONN_STRING is required" >&2
          exit 1
        fi
        exec redis-server --requirepass "$$password" --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - kittyvibe-net
    healthcheck:
      test:
        - CMD-SHELL
        - |
          password="$${REDIS_PASSWORD:-}"
          if [ -z "$$password" ]; then
            password="$$(printf '%s' "$${REDIS_CONN_STRING:-}" | sed -n 's#^redis://:\([^@]*\)@.*#\1#p')"
          fi
          redis-cli -a "$$password" ping
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  kittyvibe-net:
    driver: bridge

volumes:
  redis_data:
